# Scoring profile: the LLM scores every posting against summary + rules below.
# Tune with: python -m job_radar --preview --limit 10
summary: >
  Software engineer with ~2 years of professional experience. Targeting
  full-time software engineering roles (frontend, backend, or full-stack).
  Core stack: React, Next.js, TypeScript, Node.js, and modern web development.
  Scoring rules:
  - STRONG FIT: mid-level or early SWE roles using React/Next/TypeScript,
    full-stack or frontend-heavy product engineering.
  - GOOD FIT: backend or platform roles where web/API skills transfer.
  - PENALIZE: manager, or roles
    focused on domains outside web (embedded, hardware, etc.).

title_include:
  - software
  - engineer
  - developer
  - frontend
  - backend
  - full stack
  - fullstack
  - React
  - Next.js
  - TypeScript
  - Node.js
  - JavaScript
  - HTML
  - CSS
  - SQL
  - NoSQL

title_exclude:
  - staff
  - principal
  - manager
  - director
  - phd
  - intern

locations_allow: []

locations_block: []

freshness_days: 21
ping_threshold: 70 # discord pings only above this LLM score
digest_threshold: 55
high_score: 80 # "urgent" styling in the embed
high_fresh_hours: 2
