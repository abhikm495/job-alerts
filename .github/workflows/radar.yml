name: job-radar
on:
  workflow_dispatch: {}        # manual + external cron-job.org hourly trigger

permissions:
  contents: read

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Restore seen-set
        uses: actions/cache@v4
        with:
          path: .state
          key: seen-${{ github.run_id }}
          restore-keys: |
            seen-

      - run: pip install -e ".[sheet,bedrock]"

      - name: Write Google credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS" ]; then
            printf '%s' "$GOOGLE_CREDENTIALS" > google-creds.json
            echo "wrote google-creds.json"
          else
            echo "no GOOGLE_CREDENTIALS secret; Sheet mirroring disabled"
          fi

      - name: Run radar
        env:
          DISCORD_WEBHOOK_URL_IN: ${{ secrets.DISCORD_WEBHOOK_URL_IN }}
          DISCORD_WEBHOOK_URL_DE: ${{ secrets.DISCORD_WEBHOOK_URL_DE }}
          DISCORD_WEBHOOK_URL_OTHER: ${{ secrets.DISCORD_WEBHOOK_URL_OTHER }}
          DISCORD_WEBHOOK_URL_DEBUG: ${{ secrets.DISCORD_WEBHOOK_URL_DEBUG }}
          # Adzuna per-country channels (2-letter ISO codes)
          DISCORD_WEBHOOK_URL_AU: ${{ secrets.DISCORD_WEBHOOK_URL_AU }}
          DISCORD_WEBHOOK_URL_AT: ${{ secrets.DISCORD_WEBHOOK_URL_AT }}
          DISCORD_WEBHOOK_URL_BE: ${{ secrets.DISCORD_WEBHOOK_URL_BE }}
          DISCORD_WEBHOOK_URL_BR: ${{ secrets.DISCORD_WEBHOOK_URL_BR }}
          DISCORD_WEBHOOK_URL_CA: ${{ secrets.DISCORD_WEBHOOK_URL_CA }}
          DISCORD_WEBHOOK_URL_CH: ${{ secrets.DISCORD_WEBHOOK_URL_CH }}
          DISCORD_WEBHOOK_URL_ES: ${{ secrets.DISCORD_WEBHOOK_URL_ES }}
          DISCORD_WEBHOOK_URL_FR: ${{ secrets.DISCORD_WEBHOOK_URL_FR }}
          DISCORD_WEBHOOK_URL_GB: ${{ secrets.DISCORD_WEBHOOK_URL_GB }}
          DISCORD_WEBHOOK_URL_IT: ${{ secrets.DISCORD_WEBHOOK_URL_IT }}
          DISCORD_WEBHOOK_URL_MX: ${{ secrets.DISCORD_WEBHOOK_URL_MX }}
          DISCORD_WEBHOOK_URL_NL: ${{ secrets.DISCORD_WEBHOOK_URL_NL }}
          DISCORD_WEBHOOK_URL_NZ: ${{ secrets.DISCORD_WEBHOOK_URL_NZ }}
          DISCORD_WEBHOOK_URL_PL: ${{ secrets.DISCORD_WEBHOOK_URL_PL }}
          DISCORD_WEBHOOK_URL_SG: ${{ secrets.DISCORD_WEBHOOK_URL_SG }}
          DISCORD_WEBHOOK_URL_ZA: ${{ secrets.DISCORD_WEBHOOK_URL_ZA }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          SEEN_PATH: .state/seen.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_PATH: google-creds.json
          SCORE_CAP: "0"
          BA_MAX_PAGES: "20"
          BA_VEROEFFENTLICHTSEIT: "14"
          ARBEITNOW_MAX_PAGES: "10"
          ARBEITNOW_GERMANY_ONLY: "false"
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_APP_KEY_2: ${{ secrets.ADZUNA_APP_KEY_2 }}
          ADZUNA_APP_KEY_3: ${{ secrets.ADZUNA_APP_KEY_3 }}
          ADZUNA_APP_KEY_4: ${{ secrets.ADZUNA_APP_KEY_4 }}
          ADZUNA_APP_KEY_5: ${{ secrets.ADZUNA_APP_KEY_5 }}
          ADZUNA_MAX_PAGES: "5"
          ADZUNA_MAX_DAYS_OLD: "21"
        run: |
          set -o pipefail
          python -m job_radar | tee run.log
          { echo '```'; tail -3 run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
