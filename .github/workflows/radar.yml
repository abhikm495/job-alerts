name: job-radar
on:
  workflow_dispatch: {}        # manual + external cron-job.org hourly trigger

permissions:
  contents: read

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Restore seen-set
        uses: actions/cache@v4
        with:
          path: .state
          key: seen-${{ github.run_id }}
          restore-keys: |
            seen-

      - run: pip install -e ".[sheet,bedrock]"

      - name: Write Google credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS" ]; then
            printf '%s' "$GOOGLE_CREDENTIALS" > google-creds.json
            echo "wrote google-creds.json"
          else
            echo "no GOOGLE_CREDENTIALS secret; Sheet mirroring disabled"
          fi

      - name: Run radar
        env:
          DISCORD_WEBHOOK_URL_IN: ${{ secrets.DISCORD_WEBHOOK_URL_IN }}
          DISCORD_WEBHOOK_URL_DE: ${{ secrets.DISCORD_WEBHOOK_URL_DE }}
          DISCORD_WEBHOOK_URL_OTHER: ${{ secrets.DISCORD_WEBHOOK_URL_OTHER }}
          DISCORD_WEBHOOK_URL_DEBUG: ${{ secrets.DISCORD_WEBHOOK_URL_DEBUG }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          SEEN_PATH: .state/seen.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_PATH: google-creds.json
          SCORE_CAP: "0"
        run: |
          set -o pipefail
          python -m job_radar | tee run.log
          { echo '```'; tail -3 run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
